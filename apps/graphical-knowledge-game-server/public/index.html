<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#19221c">
  <meta name="application-name" content="{{title}}">
  <meta name="description" content="{{description}}">
  <title>{{title}}</title>
  <link rel="stylesheet" href="/vaultmaze.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to the room</a>
  <header class="masthead">
    <a class="brand" href="#/" aria-label="{{title}} home"><span class="brand-mark" aria-hidden="true">V</span><span><h1>{{title}}</h1><small>{{eyebrow}}</small></span></a>
    <label class="search-box"><span aria-hidden="true">⌕</span><input id="search" type="search" autocomplete="off" placeholder="Search the vault…" aria-label="Search the vault"><kbd>/</kbd></label>
    <div class="identity" id="identity">Opening the gate…</div>
  </header>
  <div class="shell">
    <aside class="sidebar" aria-label="Knowledge garden navigation">
      <nav>
        <a class="nav-home" href="#/">Garden entrance</a>
        <p class="nav-label">Collections</p>
        <div id="collection-nav" class="collection-nav" aria-busy="true"></div>
        <p class="nav-label">Views</p>
        <a href="#/catalogue">Catalogue atlas</a>
        <a href="#/walk">Today's walk</a>
        <a href="#/maze">Walk</a>
        <a href="#/halls">Halls</a>
        <a href="#/map">Map</a>
        <a href="#/graph">Knowledge graph</a>
      </nav>
      <footer><p><strong>SPACE</strong><br>Semantic Position Arranging Conceptual Elements</p><p><strong>TUFTE</strong><br>Tiling User Form Topology Engine</p></footer>
    </aside>
    <main id="main" tabindex="-1">
      <div id="loading" class="loading" aria-live="polite"><span class="orb" aria-hidden="true"></span><p>Indexing the corridors…</p></div>
      <div id="view" hidden></div>
    </main>
  </div>
  <template id="room-card-template"><a class="room-card"><span class="room-kind"></span><strong class="room-title"></strong><span class="room-summary"></span><span class="room-path"></span></a></template>
  <script type="module" src="/app.js"></script>
</body>
</html>
