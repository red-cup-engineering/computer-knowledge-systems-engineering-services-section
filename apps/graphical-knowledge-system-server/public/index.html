<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173f38">
  <title>GEODE</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <a class="skip-link" href="#note">Skip to note</a>
  <div class="geode-shell" data-tufte data-action-endpoint="/api/action" data-revision="geode-workspace/v1">
    <header class="masthead">
      <div>
        <p class="eyebrow">Local Markdown knowledge system</p>
        <h1>GEODE</h1>
      </div>
      <button id="refresh" type="button">Refresh vault</button>
    </header>

    <aside class="library" aria-label="Vault documents">
      <label for="search">Find a note</label>
      <input id="search" type="search" placeholder="Title, path, heading, keyword…" autocomplete="off">
      <p id="library-summary" class="muted" aria-live="polite"></p>
      <nav id="collections" class="collections" aria-label="Folders"></nav>
      <div id="explorer-path" class="explorer-path" aria-live="polite"></div>
      <nav id="explorer" class="explorer" aria-label="Vault files"></nav>
      <nav id="documents" aria-label="Search results" hidden></nav>
    </aside>

    <section class="workspace-center" aria-label="Open notes">
      <nav id="tabs" class="workspace-tabs" aria-label="Open note tabs"></nav>
      <main id="note" class="note tufte-grid" tabindex="-1">
        <p class="empty-state">Search or choose a file to begin.</p>
      </main>
    </section>

    <aside class="context" aria-label="Note context">
      <section>
        <h2>Properties</h2>
        <dl id="properties"></dl>
      </section>
      <section>
        <h2>Backlinks</h2>
        <ul id="backlinks"></ul>
      </section>
      <section>
        <h2>Outgoing</h2>
        <ul id="outgoing"></ul>
      </section>
      <section>
        <h2>Vault health</h2>
        <dl id="health"></dl>
      </section>
      <section>
        <h2>Concepts</h2>
        <p id="concept-summary-status" class="muted" aria-live="polite"></p>
        <dl id="concept-summary"></dl>
      </section>
    </aside>

    <footer class="statusbar">
      <span id="status" aria-live="polite">Opening workspace…</span>
      <span><kbd>Ctrl</kbd>/<kbd>⌘</kbd> + <kbd>K</kbd> to find</span>
    </footer>
  </div>
  <script type="module" src="/app.js"></script>
</body>
</html>
